
name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version (e.g. 0.3.1)'
        required: true
        type: string
      release_type:
        description: 'CurseForge release channel'
        required: true
        type: choice
        options:
          - release
          - beta
          - alpha
        default: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # First checkout main so we can create a missing tag.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Resolve the requested tag and create it if necessary.
      - name: Resolve and create tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TAG="$INPUT_TAG"

          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: $TAG"
            exit 1
          fi

          echo "Requested tag: $TAG"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
              echo "Error: tag $TAG does not exist."
              exit 1
            fi

            echo "Creating tag $TAG on current main..."

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag "$TAG"
            git push origin "$TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Manual releases build the current main branch. Existing tags may
          # point to an older commit and must not silently build stale source.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "checkout_ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=$TAG" >> "$GITHUB_OUTPUT"
          fi

      # Checkout the actual release tag.
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.checkout_ref }}
          fetch-depth: 0

      # The changelog: changelogs/<version>.md if it exists, otherwise the commit subjects since the previous tag.
      - name: Build changelog
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if [ -f "changelogs/${TAG}.md" ]; then
            cp "changelogs/${TAG}.md" RELEASE_CHANGELOG.md
          else
            PREV=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1)
            {
              echo "## It Was Tall ${TAG}"
              echo
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty=format:'- %s' "${PREV}..HEAD"
              else
                git log --no-merges --pretty=format:'- %s' -n 30
              fi
              echo
            } > RELEASE_CHANGELOG.md
          fi
          cat RELEASE_CHANGELOG.md

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # Build the mod.
      - name: Build mod
        run: |
          ./gradlew build --no-daemon -Pmod_version=${{ steps.resolve.outputs.tag }}

      # Verify the resulting jar.
      - name: Verify JAR
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          ls -lah build/libs/

          test -f "build/libs/it-was-tall-${TAG}.jar" || {
            echo "ERROR: JAR not found!"
            exit 1
          }

          echo "JAR successfully built!"

      # Upload the same JAR to CurseForge.
      - name: Publish to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'release' }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "CF_API_TOKEN secret is missing."
            exit 1
          fi

          JAR="build/libs/it-was-tall-${TAG}.jar"
          METADATA=$(jq -n \
            --arg version "$TAG" \
            --arg releaseType "$RELEASE_TYPE" \
            --rawfile changelog RELEASE_CHANGELOG.md \
            '{
              displayName: ("It Was Tall " + $version),
              changelog: $changelog,
              changelogType: "markdown",
              gameVersionNames: ["Client", "Server", "1.21.1", "Fabric"],
              releaseType: $releaseType
            }')

          curl --fail-with-body --silent --show-error \
            -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=$METADATA;type=application/json" \
            -F "file=@$JAR;type=application/java-archive" \
            "https://minecraft.curseforge.com/api/projects/1778484/upload-file"

      # Publish GitHub Release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: It Was Tall ${{ steps.resolve.outputs.tag }}
          body_path: RELEASE_CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type != 'release' }}
          files: build/libs/it-was-tall-${{ steps.resolve.outputs.tag }}.jar
