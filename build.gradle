plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex('software\\.bernie.*')
            includeGroup('com.eliotlash.mclib')
        }
    }
    maven {
        // Simple Voice Chat API (optional: walkie-talkie and It mimicking voices only work with that mod)
        name = 'Henkelmax'
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup('de.maxhenkel.voicechat')
        }
    }
}

loom {
    splitEnvironmentSourceSets()
}

// MODPLAN §24.2: Fabric GameTests live in their own source set (and their own tiny mod), so they are
// never part of the released jar. Run them with:  ./gradlew runGametest
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        'itwastall' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        'itwastall-gametest' {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.file('build/gametest/junit.xml')}"
            runDir "build/gametest"
            source sourceSets.gametest
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
